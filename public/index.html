<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080c0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lallu 🎬</title>
  <meta name="description" content="Seedha movie dhundho, seedha download karo. Koi ad nahi." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <button class="nav-logo" id="navLogo" aria-label="Home">
        <span class="nav-logo-text">Lallu<span class="nav-logo-dot">.</span></span>
        <span class="nav-logo-sub">seedha download karo</span>
      </button>
      <div class="nav-right">
        <button class="nav-home-btn" id="navHomeBtn" aria-label="Back to search">
          ← Search
        </button>
      </div>
    </div>
  </nav>

  <main class="app" id="app">

    <!-- Screen: Hero -->
    <section class="screen" id="s-hero" aria-label="Home">
      <div class="hero">
        <div class="hero-eyebrow">Tumhara personal movie theater 🍿</div>
        <h1 class="hero-title">Dhundho.<br><span class="hero-accent">Download Karo.</span></h1>
        <p class="hero-sub">Koi ad nahi, koi jhanjhat nahi — seedha movie milegi ⚡</p>

        <div class="search-wrap" id="heroSearchWrap">
          <div class="search-box" id="heroSearchBox">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="Movie ya web series ka naam..."
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <button class="search-btn" id="searchBtn" aria-label="Search">Dhundho</button>
          </div>
        </div>

        <div class="chips" role="list" aria-label="Quick searches">
          <span class="chips-label">Try karo →</span>
          <button class="chip" data-query="Pushpa 2" role="listitem">🌿 Pushpa 2</button>
          <button class="chip" data-query="Stree 2" role="listitem">👻 Stree 2</button>
          <button class="chip" data-query="Animal" role="listitem">🐯 Animal</button>
          <button class="chip" data-query="Avengers" role="listitem">⚡ Avengers</button>
          <button class="chip" data-query="Jawan" role="listitem">🔥 Jawan</button>
        </div>
      </div>
    </section>

    <!-- Screen: Search Results -->
    <section class="screen" id="s-results" aria-label="Search results">
      <div class="page-head">
        <button class="back-btn" id="backToHero" aria-label="Back">← Wapas</button>
        <div class="page-head-info">
          <h2 class="page-title">🔍 "<span id="resultsQuery"></span>"</h2>
          <span class="results-badge" id="resultsCount"></span>
        </div>
      </div>
      <div class="results-grid" id="resultsGrid" role="list"></div>
      <div class="load-more-wrap" id="loadMoreWrap" style="display: none;">
        <button class="btn" id="loadMoreBtn">Load More</button>
      </div>
      <div class="state-wrap" id="searchLoading">
        <div class="spinner" aria-label="Loading"></div>
        <p>Dhundh raha hun... 🔍</p>
      </div>
      <div class="state-wrap" id="searchEmpty">
        <div class="state-icon">😕</div>
        <h3>Kuch nahi mila</h3>
        <p>Doosra naam try karo</p>
      </div>
    </section>

    <!-- Screen: Files -->
    <section class="screen" id="s-files" aria-label="Files">
      <div class="page-head">
        <button class="back-btn" id="backToResults" aria-label="Back">← Wapas</button>
        <div class="movie-head" id="movieHead"></div>
      </div>
      <div class="files-wrap">
        <div class="section-label">🗂️ Available Files</div>
        <div class="files-list" id="filesList"></div>
        <div class="state-wrap" id="filesLoading">
          <div class="spinner" aria-label="Loading"></div>
          <p id="filesLoadingMsg">Files load ho rahi hain... 📁</p>
        </div>
      </div>
    </section>

    <!-- Screen: Download -->
    <section class="screen" id="s-download" aria-label="Download">
      <div class="page-head">
        <button class="back-btn" id="backToFiles" aria-label="Back">← Wapas</button>
      </div>
      <div class="dl-wrap">
        <div id="dlCard"></div>
      </div>
    </section>

  </main>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastMsg"></span>
  </div>

  <!-- Admin FAB -->
  <button class="admin-fab" id="adminFab" title="Admin" aria-label="Admin panel">⚙️</button>

  <!-- Admin Modal -->
  <div class="admin-overlay" id="adminOverlay" role="dialog" aria-modal="true" aria-label="Admin Panel">
    <div class="admin-modal">
      <div class="admin-header">
        <div style="display:flex; align-items:center; gap:12px;">
        <span class="admin-title">🔐 Admin</span>
          <button id="adminClearBtn" class="btn-copy" style="display:none; padding: 3px 8px; font-size:0.7rem; border-color:var(--red); color:var(--red); background:transparent;">??? Clear</button>
        </div>
        <button class="admin-close" id="adminClose" aria-label="Close">✕</button>
      </div>
      <div id="adminAuth">
        <div class="admin-auth">
          <div class="admin-lock">🔒</div>
          <p class="admin-hint">Password daalo</p>
          <input type="password" class="admin-input" id="adminPassInput" placeholder="••••••••" autocomplete="off" />
          <button class="admin-submit" id="adminPassBtn">Unlock →</button>
          <p class="admin-err" id="adminPassErr"></p>
        </div>
      </div>
      <div id="adminLogs">
        <div class="admin-stats" id="adminStats"></div>
        <div class="admin-log-list" id="adminLogList"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
